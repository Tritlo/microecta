name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.1.0"
          pattern: |
            microfta/**/*.hs
            microfta-generator/**/*.hs
            microecta/**/*.hs
            microecta-generator/**/*.hs
            microlta/**/*.hs

      - name: Set up hlint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"

      - name: Run hlint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["microfta", "microfta-generator", "microecta", "microecta-generator", "microlta"]'
          fail-on: warning

  build-test-bench:
    name: GHC 9.14.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"
          cabal-update: true

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Configure build plan
        run: cabal v2-build all --dry-run --enable-tests --enable-benchmarks

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: deps-cache
        env:
          key: cabal-store-microecta-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: cabal v2-build all --only-dependencies --enable-tests --enable-benchmarks

      - name: Save cached dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Check package metadata
        run: |
          (cd microfta && cabal check)
          (cd microfta-generator && cabal check)
          (cd microecta && cabal check)
          (cd microecta-generator && cabal check)
          (cd microlta && cabal check)

      - name: Build with strict warnings
        run: cabal v2-build all --enable-tests --enable-benchmarks --ghc-options=-Werror

      # The dense PathTrie representation used to make an -O2 build of the core
      # exhaust small development machines. This is the regression guard for
      # that: it fails here rather than in a downstream build, which is why the
      # cap is not baked into the library's ghc-options.
      - name: Guard compile-time memory of the optimized core
        run: |
          cabal v2-build lib:microecta \
            --enable-optimization=2 \
            --ghc-options='-Werror +RTS -K512M -M512M -RTS'

      - name: Test
        run: cabal v2-test all --enable-optimization=2 --ghc-options=-Werror --test-show-details=direct

      # Run the library examples with the supported compiler.
      - name: Doctest
        run: |
          cabal install doctest --ignore-project --overwrite-policy=always \
            --install-method=copy --installdir="$HOME/.local/bin"
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:microfta
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:microfta-generator
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:microecta
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:microecta-generator
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:microlta

      - name: Test the generator examples
        run: |
          cabal v2-run fta-pairs
          cabal v2-run ecta-finite-languages

      - name: Validate release artifacts
        run: |
          scripts/release.sh microfta --check-only
          scripts/release.sh microfta-generator --check-only
          scripts/release.sh microecta --check-only
          scripts/release.sh microecta-generator --check-only
          scripts/release.sh microlta --check-only

      - name: Benchmark
        run: cabal v2-bench all --enable-optimization=2
